# Honeypot ต้องอยู่บนสุด ก่อนกฎบล็อกนามสกุลไฟล์
location ~* ^/(phpmyadmin|pma|wp-admin-backup|old-admin|backup\.zip|db\.sql) {
    access_log /var/log/nginx/honeypot.log;
    return 404;
}

# ซ่อน ?author= ทุกรูปแบบ เฉพาะหน้าเว็บ
set $block_author 0;
if ($args ~* "(^|&)author(=|%5B|\[)") { set $block_author 1; }
if ($uri ~ "^/wp-admin/") { set $block_author 0; }
if ($block_author) { return 403; }

# ซ่อน REST API รายชื่อ user (ชั้นจริงอยู่ใน WordPress ดูข้อถัดไป)
set $block_users 0;
if ($request_uri ~* "wp(/|%2F)v2(/|%2F)users") { set $block_users 1; }
if ($http_cookie ~* "wordpress_logged_in") { set $block_users 0; }
if ($block_users) { return 403; }

# ห้ามรันไฟล์ PHP ในโฟลเดอร์ uploads
location ~* ^/wp-content/uploads/.*\.(php|phtml|phar)$ { deny all; }

# บล็อกไฟล์ซ่อน (.env, .git, .htaccess)
location ~ /\.(?!well-known) { deny all; }

# บล็อกไฟล์สำรองและไฟล์ลับ
location ~* \.(bak|old|orig|sql|swp|env|ini|log)$ { deny all; }
location = /wp-config.php { deny all; }
