# cache หน้าที่ PHP สร้าง: หน่วยความจำ 10 MB สำหรับเก็บรายการ, ดิสก์ไม่เกิน 256 MB
fastcgi_cache_path /var/cache/nginx/wordpress levels=1:2 keys_zone=WORDPRESS:10m inactive=60m max_size=256m;
fastcgi_cache_key "$scheme$request_method$host$request_uri";

# rate limit หน้าล็อกอิน: 10 ครั้งต่อนาทีต่อ IP
limit_req_zone $binary_remote_addr zone=wplogin:1m rate=10r/m;
limit_req_status 429;
