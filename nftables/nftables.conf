#!/usr/sbin/nft -f
flush ruleset

table inet filter {

    # ช่วง IP ของประเทศไทย (เติมจากไฟล์ th.nft)
    set th_v4 {
        type ipv4_addr
        flags interval
        auto-merge
    }

    # IP ที่ผ่านได้เสมอ (IP บ้านผู้ดูแล)
    set admin_v4 {
        type ipv4_addr
        flags interval
        elements = { x.x.x.x }
    }

    chain input {
        type filter hook input priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept
        iifname "tailscale0" tcp dport { 22, 443 } accept
        udp dport 41641 accept


        tcp dport { 80, 443 } ip saddr @th_v4 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

include "/etc/nftables.d/th.nft"
